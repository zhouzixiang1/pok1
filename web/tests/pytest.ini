[pytest]
timeout = 30
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Deselect slow tests (real bot subprocesses, multi-second) by default.
# Run them explicitly with: pytest -m slow
addopts = -m "not slow"
# Suppress the benign BrokenPipeError that _PersistentBot's Popen objects
# emit from their GC finalizer on close (a subprocess-module quirk, not a
# test bug). Scoped to PytestUnraisableExceptionWarning to avoid masking
# other unraisable exceptions.
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
