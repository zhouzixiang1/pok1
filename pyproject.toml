[project]
name = "pok-arena"
version = "0.1.0"
description = "国赛德州扑克对弈平台 web 复刻 — TCP 服务器接两个外部 bot 引擎打 70 局,实时观赛"
readme = "HANDOFF.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "pok-arena" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "python-multipart>=0.0.9",  # bot 上传(UploadFile)
    "websockets>=12",  # 预留;SSE 用 StreamingResponse 不强需
    "captcha>=0.6",  # 自建图形/算术验证码(lepture/captcha)
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # FastAPI TestClient
]

# CLI 入口:`pok-arena serve ...`(实现后启用)
[project.scripts]
pok-arena = "arena.backend.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 项目根 = 本文件所在目录;主包为 arena/
include = ["arena*"]
exclude = ["arena.frontend*"]  # 前端是 React,非 Python 包

[tool.pytest.ini_options]
testpaths = ["arena/backend/tests", "tests"]
pythonpath = ["."]
